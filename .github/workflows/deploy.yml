name: CI/CD Flask Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-app:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/flask-app:latest

            echo "Stopping old container if it exists..."
            sudo docker stop flask-container || true
            sudo docker rm flask-container || true

            echo "Creating tables once..."
            sudo docker run --rm \
              -e FLASK_ENV=production \
              -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              ${{ secrets.DOCKER_USERNAME }}/flask-app:latest \
              python -c "from app import create_app, db; app=create_app(); app.app_context().push(); db.create_all()"

            echo "Starting app container..."
            sudo docker run -d \
              -p 5000:8000 \
              --name flask-container \
              -e FLASK_ENV=production \
              -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/flask-app:latest

            echo "Container status:"
            sudo docker ps -a

            echo "Container logs:"
            sudo docker logs flask-container --tail 100 || true