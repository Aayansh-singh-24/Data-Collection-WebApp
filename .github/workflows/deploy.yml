name: CI/CD Flask Docker

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flask-app
  CONTAINER_NAME: flask-container
  APP_PORT: 5000
  CONTAINER_PORT: 8000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            CONTAINER="${{ env.CONTAINER_NAME }}"

            echo "Pulling new image..."
            sudo docker pull $IMAGE

            echo "Creating production env file..."
            cat > .env.production <<EOF
            FLASK_ENV=production
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EOF

            echo "Running database setup..."
            sudo docker run --rm \
              --env-file .env.production \
              $IMAGE \
              python -c "from app import create_app, db; app=create_app(); app.app_context().push(); db.create_all()"

            echo "Stopping old container..."
            sudo docker stop $CONTAINER || true
            sudo docker rm $CONTAINER || true

            echo "Starting new container..."
            sudo docker run -d \
              --name $CONTAINER \
              --env-file .env.production \
              -p ${{ env.APP_PORT }}:${{ env.CONTAINER_PORT }} \
              --restart unless-stopped \
              $IMAGE

            echo "Checking container status..."
            sleep 5
            sudo docker ps

            echo "Showing recent logs..."
            sudo docker logs $CONTAINER --tail 50 || true

            echo "Cleaning unused Docker images..."
            sudo docker image prune -f