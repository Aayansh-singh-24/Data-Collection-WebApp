{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 col-sm-8 col-12">
      <div class="card shadow-sm border-0 app-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="form-icon mb-3">
              <span class="icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M20 8v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M23 11h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <h1 class="h4 mb-2">Create an account</h1>
            <p class="text-muted small mb-0">
              Fill in the details below to get started.
            </p>
          </div>

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="username"
                name="username"
                placeholder="johndoe"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control form-control-lg"
                id="email"
                name="email"
                placeholder="john@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label">Confirm Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                id="confirm_password"
                name="confirm_password"
                placeholder="••••••••"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">
                Create Account
              </button>
              <p class="text-center small mb-0 mt-2">
                <span class="text-muted">Already have an account?</span>
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign in</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
