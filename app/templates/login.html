{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <div class="row justify-content-center w-100">
    <div class="col-lg-4 col-md-5 col-sm-8 col-12">
      <div class="card border-0 app-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="form-icon mb-3">
              <span class="icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                  <polyline points="10 17 15 12 10 7"/>
                  <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
              </span>
            </div>
            <h1 class="h4 fw-bold mb-2" style="color:#f8fafc;">Welcome back</h1>
            <p class="text-muted small mb-0" style="color:#f8fafc ;">
              Sign in to your account to continue.
            </p>
          </div>

          <form method="post" novalidate style="width: 100%;">
            <div class="mb-3" style="width: 100%;">
              <label for="username" class="form-label" style="color:#f8fafc ;">Username</label>
              <div class="input-group">
                <span class="input-group-text">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                  </svg>
                </span>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="username"
                  name="username"
                  placeholder="johndoe"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label" style="color:#f8fafc ;">Password</label>
              <div class="input-group">
                <span class="input-group-text">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
                  </svg>
                </span>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">
                Sign In
              </button>
              <p class="text-center small mb-0 mt-3" >
                <span class="text-muted" style="color:#f8fafc ;">Don't have an account?</span>
                <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Create one</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
