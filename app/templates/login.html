{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 col-sm-8 col-12">
      <div class="card shadow-sm border-0 app-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="form-icon mb-3">
              <span class="icon-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M10 17l5-5-5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M15 12H3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </div>
            <h1 class="h4 mb-2">Welcome back</h1>
            <p class="text-muted small mb-0">
              Sign in to your account to continue.
            </p>
          </div>

          <form method="post" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="username"
                name="username"
                placeholder="johndoe"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">
                Sign In
              </button>
              <p class="text-center small mb-0 mt-2">
                <span class="text-muted">Don't have an account?</span>
                <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Create one</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
